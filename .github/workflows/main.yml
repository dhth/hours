name: main

on:
  push:
    branches:
      - 'main'

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
      release: ${{ steps.filter.outputs.release }}
      workflows: ${{ steps.filter.outputs.workflows }}
      yml: ${{ steps.filter.outputs.yml }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "cmd/**"
              - "internal/**"
              - "tests/**"
              - "**/*.go"
              - "go.*"
              - "mise.toml"
              - "mise.lock"
              - ".golangci.yml"
              - "main.go"
              - ".github/actions/**"
              - ".github/workflows/main.yml"
            deps:
              - "go.mod"
              - "go.sum"
              - "mise.toml"
              - "mise.lock"
              - ".github/workflows/main.yml"
            release:
              - ".goreleaser.yml"
              - "mise.toml"
              - "mise.lock"
              - ".github/workflows/main.yml"
            workflows:
              - ".github/workflows/**.yml"
              - "mise.toml"
              - "mise.lock"
            yml:
              - "**.yml"
              - "**.yaml"
              - "mise.toml"
              - "mise.lock"

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: go golangci-lint
      - name: Lint
        run: mise run lint

  build:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: go
      - name: Run smoke checks
        run: mise run smoke

  test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: go
      - name: Test
        run: mise run test

  lint-yaml:
    needs: changes
    if: ${{ needs.changes.outputs.yml == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: yamlfmt
      - name: Lint YAML
        run: mise run lint:yaml

  lint-workflows:
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: actionlint
      - name: Lint workflows
        run: mise run lint:actions

  release-check:
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: goreleaser
      - name: Release check
        run: mise run release:check

  back-compat:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - run: git checkout HEAD~1
      - name: Set up mise for HEAD~1
        uses: jdx/mise-action@v4
        with:
          install_args: go
      - name: build last commit
        run: |
          go build -o hours_prev
          cp hours_prev /var/tmp
          rm hours_prev
      - run: git checkout main
      - name: Set up mise for head
        uses: jdx/mise-action@v4
        with:
          install_args: go
      - name: build head
        run: |
          go build -o hours_head
          cp hours_head /var/tmp
          rm hours_head
      - name: Run last version
        run: |
          /var/tmp/hours_prev --dbpath=/var/tmp/throwaway-empty.db report 3d -p
          /var/tmp/hours_prev --dbpath=/var/tmp/throwaway-with-data.db gen -y
      - name: Run current version
        run: |
          echo "empty"
          /var/tmp/hours_head --dbpath=/var/tmp/throwaway-empty.db report 3d -p
          /var/tmp/hours_head --dbpath=/var/tmp/throwaway-empty.db log 3d -p
          /var/tmp/hours_head --dbpath=/var/tmp/throwaway-empty.db stats 3d -p
          echo "with data"
          /var/tmp/hours_head --dbpath=/var/tmp/throwaway-with-data.db report 3d -p
          /var/tmp/hours_head --dbpath=/var/tmp/throwaway-with-data.db log 3d -p
          /var/tmp/hours_head --dbpath=/var/tmp/throwaway-with-data.db stats 3d -p

  vulncheck:
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: go go:golang.org/x/vuln/cmd/govulncheck
      - name: Vulnerability check
        run: mise run vulncheck
